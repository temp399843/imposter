<title>Imposter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0e0b1a;--card:#191430;--card2:#231c41;--line:#30285a;--txt:#f5f2ff;--mut:#9d95c2;--acc:#8b5cf6;--acc2:#c4a1ff;--red:#ff4d6d;--teal:#2dd4bf;--yel:#fbbf24}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;min-height:100%}
body{background:radial-gradient(900px 500px at 50% -180px,#2b1d63 0%,transparent 65%),var(--bg);min-height:100vh;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
#app{max-width:560px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 16px 130px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
.logo{font-size:46px;font-weight:900;letter-spacing:.14em;text-align:center;background:linear-gradient(90deg,#fff,var(--acc2),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:6px}
.sub{text-align:center;color:var(--mut);font-size:14px;margin:4px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--mut);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.card h2 .links button{color:var(--acc2);font-size:12px;letter-spacing:.08em;font-weight:800;padding:2px 4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:12px 6px;border-radius:11px;font-weight:700;font-size:15px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.seg.small button{padding:9px 4px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--mut)}
.chip.on{background:rgba(139,92,246,.24);border-color:var(--acc);color:var(--txt)}
.chip small{opacity:.55;font-weight:500;margin-left:3px}
.player{display:flex;gap:8px;margin-bottom:8px}
input,textarea{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:none;margin-top:12px;line-height:1.4}
.x{width:46px;flex-shrink:0;border-radius:12px;background:var(--card2);color:var(--mut);font-size:16px}
.add{width:100%;padding:12px;border:1px dashed var(--line);border-radius:12px;color:var(--acc2);font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.row+.row{border-top:1px solid var(--line)}
.row .lbl{font-weight:600;font-size:15px}
.row .lbl small{display:block;color:var(--mut);font-weight:400;font-size:12.5px;margin-top:2px}
.stepper{display:flex;align-items:center;gap:10px;flex-shrink:0}
.stepper button{width:42px;height:42px;border-radius:12px;background:var(--card2);font-size:22px;font-weight:700}
.stepper span{min-width:26px;text-align:center;font-size:22px;font-weight:800}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}
.sw.on::after{left:23px}
.subhead{font-size:13px;color:var(--mut);font-weight:700;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.1em}
.wrow{display:grid;grid-template-columns:100px 1fr 46px;align-items:center;gap:10px;padding:7px 0}
.wrow span:first-child{font-size:14px;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;background:var(--line);border-radius:6px;padding:0;border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--acc2);border:3px solid #fff}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--acc2);border:3px solid #fff}
.pct{font-weight:800;text-align:right;color:var(--acc2);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--mut);margin-top:10px;line-height:1.45}
.hint button{color:var(--acc2);font-weight:700;font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(rgba(14,11,26,0),var(--bg) 40%);z-index:5}
.bar .in{max-width:528px;margin:0 auto;display:flex;gap:10px}
.big{flex:1;display:block;width:100%;padding:18px;border-radius:18px;background:linear-gradient(135deg,var(--acc),#6d28d9);color:#fff;font-size:18px;font-weight:800;box-shadow:0 10px 30px rgba(139,92,246,.35)}
.big.red{background:linear-gradient(135deg,var(--red),#be123c);box-shadow:0 10px 30px rgba(255,77,109,.3)}
.big.ghost{background:var(--card2);box-shadow:none;border:1px solid var(--line)}
.big.half{flex:0 0 36%}
.topbar{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:13px;font-weight:800;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.endbtn{font-size:13px;color:var(--mut);padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.screen{min-height:calc(100vh - 210px);display:flex;flex-direction:column;justify-content:center;text-align:center;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:10px 0}
.name{font-size:48px;font-weight:900;line-height:1.05;word-break:break-word;margin:6px 0 10px}
.name.sm{font-size:34px}
.lead{color:var(--mut);font-size:16px;line-height:1.5;margin:8px auto;max-width:400px}
.reveal{border-radius:28px;padding:36px 20px;margin:14px 0;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.reveal.crew{background:linear-gradient(160deg,#124643,#0c2321);border:2px solid var(--teal)}
.reveal.imp{background:linear-gradient(160deg,#5c0f22,#24060e);border:2px solid var(--red)}
.reveal.q{background:linear-gradient(160deg,#2b2160,#151034);border:2px solid var(--acc)}
.reveal .kicker{margin-top:0}
.emoji{font-size:56px;margin-bottom:8px}
.word{font-size:40px;font-weight:900;line-height:1.12;word-break:break-word}
.qtext{font-size:25px;font-weight:800;line-height:1.3}
.catl{margin-top:14px;font-size:15px;font-weight:700;color:rgba(255,255,255,.75)}
.tip{margin-top:14px;font-size:14px;color:rgba(255,255,255,.7)}
.pill{display:inline-block;margin:14px auto 0;padding:10px 16px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px}
.timerbox{margin:22px auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;width:100%}
.timer{font-size:58px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.done{color:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.tbtns{display:flex;gap:8px;justify-content:center;margin-top:8px}
.tbtn{padding:10px 18px;border-radius:12px;background:var(--card2);font-weight:700;font-size:14px}
.ansrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:8px 0}
.ansrow .an{color:var(--mut);font-weight:700;font-size:14px;flex-shrink:0;padding-top:2px}
.ansrow .av{font-weight:800;font-size:18px;text-align:right;word-break:break-word}
.ansrow.imp{border-color:var(--red);background:rgba(255,77,109,.13)}
.ansrow.imp .an{color:var(--red)}
.impnames{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.impchip{padding:12px 18px;border-radius:999px;background:rgba(255,77,109,.16);border:2px solid var(--red);font-weight:800;font-size:20px}
.noimp{font-size:20px;font-weight:800;color:var(--yel);margin-top:6px}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--red);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:20;animation:in .25s}
.list{text-align:left;margin-top:6px}
.lock{font-size:70px;margin-bottom:6px}
.qhead{font-size:13px;color:var(--mut);margin-top:6px}
</style>
</head>

/* ============ STORAGE ============ */
const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const defW = {}; for(let k=0;k<20;k++) defW[k] = k===0?1:k===1?10:k===2?4:k===3?2:1;
const DEFAULTS = {
  players:["","","",""], mode:"words",
  wordCats:Object.keys(WORDS), qCats:Object.keys(QUESTIONS), custom:"",
  impMode:"fixed", impFixed:1, impMin:1, impMax:2, weights:defW,
  showCount:true, impSeeCat:true, impSeeEach:false, timer:0
};
let S = Object.assign({}, DEFAULTS, LS.get("imp.settings",{}));
S.weights = Object.assign({}, defW, S.weights||{});
S.wordCats = (S.wordCats||[]).filter(c=>WORDS[c]||c===CUSTOM);
S.qCats = (S.qCats||[]).filter(c=>QUESTIONS[c]);
if(!Array.isArray(S.players)||S.players.length<3) S.players = DEFAULTS.players.slice();
const save = ()=>LS.set("imp.settings",S);

/* ============ HELPERS ============ */
const $ = s=>document.querySelector(s);
const app = $("#app");
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rand = a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const customList = ()=>S.custom.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
const catEmoji = c=>c===CUSTOM?"✏️":(WORDS[c]||QUESTIONS[c]||{}).e||"";
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

function normalize(){
  const maxI = S.players.length-1;
  S.impFixed = clamp(S.impFixed,1,maxI);
  S.impMin = clamp(S.impMin,0,maxI);
  S.impMax = clamp(S.impMax,S.impMin,maxI);
}
normalize();

function weightInfo(n){
  const maxI=n-1, lo=clamp(S.impMin,0,maxI), hi=clamp(S.impMax,lo,maxI), ks=[];
  for(let k=lo;k<=hi;k++) ks.push(k);
  let ws = ks.map(k=>Math.max(0,+S.weights[k]||0)), t = ws.reduce((a,b)=>a+b,0);
  if(t<=0){ws=ks.map(()=>1);t=ks.length}
  return {lo,hi,ks,ws,t};
}
function pickCount(n){
  if(S.impMode==="fixed") return clamp(S.impFixed,1,n-1);
  const {ks,ws,t}=weightInfo(n); let r=Math.random()*t;
  for(let i=0;i<ks.length;i++){ r-=ws[i]; if(r<0) return ks[i]; }
  return ks[ks.length-1];
}

function wordPool(){
  const pool=[];
  S.wordCats.forEach(c=>{ (c===CUSTOM?customList():WORDS[c].w).forEach(w=>pool.push({w,cat:c})) });
  return pool;
}
function qPool(){ const pool=[]; S.qCats.forEach(c=>QUESTIONS[c].q.forEach(p=>pool.push({p,cat:c}))); return pool; }
function pickFrom(pool,key,store){
  if(!pool.length) return null;
  const used = new Set(LS.get(store,[]));
  let fresh = pool.filter(x=>!used.has(key(x)));
  if(!fresh.length){ pool.forEach(x=>used.delete(key(x))); fresh=pool; }
  const x = rand(fresh); used.add(key(x));
  LS.set(store,[...used].slice(-4000));
  return x;
}
function freshCount(){
  const isW=S.mode==="words";
  const pool=isW?wordPool():qPool(), key=isW?(x=>x.w):(x=>x.p[0]);
  const used=new Set(LS.get(isW?"imp.usedW":"imp.usedQ",[]));
  return {total:pool.length, fresh:pool.filter(x=>!used.has(key(x))).length};
}

/* ============ TIMER ============ */
const T = {left:0,end:0,running:false,iv:null};
function timerInit(){clearInterval(T.iv);T.running=false;T.left=S.timer*60;updateTimer()}
function stopTimer(){clearInterval(T.iv);T.running=false}
function timerToggle(){
  if(T.running){T.left=Math.max(0,(T.end-Date.now())/1000);stopTimer()}
  else{ if(T.left<=0) T.left=S.timer*60; T.end=Date.now()+T.left*1000; T.running=true; T.iv=setInterval(tick,250); }
  updateTimer();
}
function tick(){
  T.left=Math.max(0,(T.end-Date.now())/1000);
  if(T.left<=0){stopTimer(); try{navigator.vibrate&&navigator.vibrate([400,150,400])}catch(e){}}
  updateTimer();
}
const fmt = s=>{s=Math.ceil(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function updateTimer(){
  const el=$("#timer"), b=$("#tgl"); if(!el) return;
  el.textContent = T.left<=0 ? "TIME!" : fmt(T.left);
  el.classList.toggle("done",T.left<=0);
  if(b) b.textContent = T.running?"Pause":(T.left<=0?"Restart":"Start timer");
}
function timerHTML(){
  if(!S.timer) return "";
  return `<div class="timerbox"><div class="timer" id="timer">${fmt(T.left)}</div><div class="tbtns"><button class="tbtn" id="tgl" data-act="timerToggle">Start timer</button><button class="tbtn" data-act="timerReset">Reset</button></div></div>`;
}

/* ============ ROUND ============ */
let screen="setup", R=null, lastScreen="";
function startRound(){
  const names = S.players.map((p,i)=>p.trim()||`Player ${i+1}`);
  const n = names.length;
  if(n<3) return toast("You need at least 3 players");
  let item;
  if(S.mode==="words"){
    item = pickFrom(wordPool(),x=>x.w,"imp.usedW");
    if(!item) return toast("Pick at least one category");
  } else {
    item = pickFrom(qPool(),x=>x.p[0],"imp.usedQ");
    if(!item) return toast("Pick at least one category");
  }
  const k = pickCount(n);
  const imps = new Set(shuffle([...Array(n).keys()]).slice(0,k));
  R = {names,n,k,imps,i:0,start:Math.floor(Math.random()*n),mode:S.mode,answers:Array(n).fill("")};
  if(S.mode==="words"){R.word=item.w;R.cat=item.cat}
  else{const swap=Math.random()<.5;R.real=swap?item.p[1]:item.p[0];R.decoy=swap?item.p[0]:item.p[1];R.cat=item.cat}
  const wi = weightInfo(n); R.lo=wi.lo; R.hi=wi.hi;
  screen="pass"; render();
}
function countText(){
  if(S.showCount) return R.k===0?"There are 0 imposters this round":R.k===1?"There is 1 imposter":`There are ${R.k} imposters`;
  if(S.impMode==="random") return `Somewhere between ${R.lo} and ${R.hi} imposters`;
  return "Unknown number of imposters";
}
const topbar = label=>`<div class="topbar"><span class="tag">${label}</span><button class="endbtn" data-act="arm" data-then="end">End round</button></div>`;

/* ============ VIEWS ============ */
function stepper(k,v,min,max){
  return `<div class="stepper"><button data-act="step" data-k="${k}" data-d="-1" ${v<=min?"disabled":""}>−</button><span>${v}</span><button data-act="step" data-k="${k}" data-d="1" ${v>=max?"disabled":""}>+</button></div>`;
}
function toggleRow(k,label,sub){
  return `<div class="row" data-act="toggle" data-k="${k}"><div class="lbl">${label}${sub?`<small>${sub}</small>`:""}</div><div class="sw ${S[k]?"on":""}"></div></div>`;
}
function weightRows(){
  const {ks,ws,t}=weightInfo(S.players.length);
  return ks.map((k,i)=>`<div class="wrow"><span>${k===0?"None 😈":k+(k===1?" imposter":" imposters")}</span><input type="range" min="0" max="10" step="1" value="${Math.max(0,+S.weights[k]||0)}" data-w="${k}"><span class="pct" id="pct${k}">${Math.round(ws[i]/t*100)}%</span></div>`).join("");
}
function updatePcts(){
  const {ks,ws,t}=weightInfo(S.players.length);
  ks.forEach((k,i)=>{const el=$("#pct"+k); if(el) el.textContent=Math.round(ws[i]/t*100)+"%"});
}

function vSetup(){
  const n=S.players.length, maxI=n-1, isW=S.mode==="words";
  const cats=isW?WORDS:QUESTIONS, sel=isW?S.wordCats:S.qCats;
  const fc=freshCount();
  let h=`<div class="logo">IMPOSTER</div><p class="sub">One phone. Pass it around. Trust no one.</p>`;

  h+=`<div class="card"><h2>Players <span>${n}</span></h2>`+
    S.players.map((p,i)=>`<div class="player"><input data-p="${i}" value="${esc(p)}" placeholder="Player ${i+1}" maxlength="18" autocomplete="off" autocapitalize="words"><button class="x" data-act="rmP" data-i="${i}" ${n<=3?"disabled":""}>✕</button></div>`).join("")+
    (n<20?`<button class="add" data-act="addP">+ Add player</button>`:"")+`</div>`;

  h+=`<div class="card"><h2>Game mode</h2><div class="seg"><button class="${isW?"on":""}" data-act="mode" data-v="words">🤫 Secret Word</button><button class="${!isW?"on":""}" data-act="mode" data-v="questions">❓ Questions</button></div>
    <p class="hint">${isW?"Everyone gets the same secret word except the imposter. Go around giving one-word clues, then vote.":"Everyone privately answers a question. The imposter secretly gets a different question and has no idea. Then the real question and everyone's answers are revealed, and the imposter has to defend their answer."}</p></div>`;

  h+=`<div class="card"><h2>${isW?"Word":"Question"} categories <span class="links"><button data-act="allCats">All</button>·<button data-act="noCats">None</button></span></h2><div class="chips">`+
    Object.keys(cats).map(c=>`<button class="chip ${sel.includes(c)?"on":""}" data-act="cat" data-c="${esc(c)}">${cats[c].e} ${esc(c)}<small>${(isW?cats[c].w:cats[c].q).length}</small></button>`).join("")+
    (isW?`<button class="chip ${sel.includes(CUSTOM)?"on":""}" data-act="cat" data-c="${CUSTOM}">✏️ Custom<small id="ccount">${customList().length}</small></button>`:"")+
    `</div>`+
    (isW&&sel.includes(CUSTOM)?`<textarea id="custom" rows="3" placeholder="Your own words, separated by commas or new lines (inside jokes welcome)">${esc(S.custom)}</textarea>`:"")+
    `<p class="hint">${fc.fresh} of ${fc.total} ${isW?"words":"questions"} not played yet. Repeats only happen after you've seen them all. <button data-act="resetUsed">Reset history</button></p></div>`;

  h+=`<div class="card"><h2>Imposters</h2><div class="seg"><button class="${S.impMode==="fixed"?"on":""}" data-act="impMode" data-v="fixed">Fixed</button><button class="${S.impMode==="random"?"on":""}" data-act="impMode" data-v="random">🎲 Random</button></div>`;
  if(S.impMode==="fixed"){
    h+=`<div class="row" style="margin-top:6px"><div class="lbl">Number of imposters</div>${stepper("impFixed",S.impFixed,1,maxI)}</div>`;
  } else {
    h+=`<div class="row" style="margin-top:6px"><div class="lbl">Minimum<small>0 allows rounds with no imposter</small></div>${stepper("impMin",S.impMin,0,maxI)}</div>
        <div class="row"><div class="lbl">Maximum</div>${stepper("impMax",S.impMax,0,maxI)}</div>
        <div class="subhead">How often each happens</div>${weightRows()}
        <p class="hint">Drag the sliders to make some amounts more likely than others. A slider at 0 never happens.</p>`;
  }
  h+=`</div>`;

  h+=`<div class="card"><h2>Options</h2>`+
    (isW?toggleRow("impSeeCat","Imposter sees the category","Gives the imposter a fighting chance")+toggleRow("impSeeEach","Imposters know each other","Only matters with 2+ imposters"):"")+
    `<div class="row" style="display:block"><div class="lbl" style="margin-bottom:10px">Discussion timer</div><div class="seg small">`+
    [0,1,2,3,5].map(v=>`<button class="${S.timer===v?"on":""}" data-act="timer" data-v="${v}">${v?v+" min":"Off"}</button>`).join("")+
    `</div></div></div>`;

  h+=`<div class="bar"><div class="in"><button class="big" data-act="start">Start game</button></div></div>`;
  return h;
}

function vPass(){
  return `${topbar(`${R.i+1} / ${R.n}`)}<div class="screen">
    <div class="kicker">Pass the phone to</div>
    <div class="name">${esc(R.names[R.i])}</div>
    <p class="lead">Make sure nobody else can see the screen.</p>
  </div><div class="bar"><div class="in"><button class="big" data-act="show">I'm ${esc(R.names[R.i])}, show me</button></div></div>`;
}

function vRole(){
  const imp=R.imps.has(R.i), last=R.i===R.n-1;
  let inner;
  if(imp){
    const others=[...R.imps].filter(x=>x!==R.i).map(x=>esc(R.names[x]));
    inner=`<div class="reveal imp"><div class="emoji">🕵️</div><div class="word">You are the IMPOSTER</div>
      ${S.impSeeCat?`<div class="catl">Category: ${catEmoji(R.cat)} ${esc(R.cat)}</div>`:""}
      ${S.impSeeEach&&others.length?`<div class="catl">Other imposter${others.length>1?"s":""}: ${others.join(", ")}</div>`:""}
      <p class="tip">Blend in. Listen to the clues and fake it.</p></div>`;
  } else {
    inner=`<div class="reveal crew"><div class="kicker">The secret word is</div><div class="word">${esc(R.word)}</div><div class="catl">${catEmoji(R.cat)} ${esc(R.cat)}</div></div>`;
  }
  return `${topbar(`${R.i+1} / ${R.n}`)}<div class="screen">${inner}<p class="lead">Remember it, then hide it.</p></div>
    <div class="bar"><div class="in"><button class="big ghost" data-act="nextRole">${last?"Hide & start discussion":"Hide & pass to "+esc(R.names[R.i+1])}</button></div></div>`;
}

function vAnswer(){
  const q = R.imps.has(R.i)?R.decoy:R.real;

}

function vDiscuss(){

function impBlock(){
  const imps=[...R.imps].map(i=>R.names[i]);
  if(!imps.length) return `<div class="kicker">Plot twist</div><div class="noimp">There was no imposter. Everyone was telling the truth 😈</div>`;
  return `<div class="kicker">${imps.length===1?"The imposter was":"The imposters were"}</div><div class="impnames">${imps.map(n=>`<span class="impchip">🕵️ ${esc(n)}</span>`).join("")}</div>`;
}

}

function render(){
  const views={setup:vSetup,pass:vPass,role:vRole,answer:vAnswer,discuss:vDiscuss,final:vFinal,qdone:vQdone,qreveal:vQreveal,qfinal:vQfinal};
  app.innerHTML = views[screen]();
  if(screen!==lastScreen) window.scrollTo(0,0);
  lastScreen = screen;
  if(screen==="answer") setTimeout(()=>{const t=$("#ans"); t&&t.focus()},50);
  updateTimer();
}

function armed(then){
  stopTimer();
  if(then==="reveal") screen = R.mode==="words"?"final":"qfinal";

  render();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
  const a=b.dataset.act;
  switch(a){
    case "addP": if(S.players.length<20){S.players.push("");normalize();save();render();const ins=document.querySelectorAll("[data-p]");ins[ins.length-1].focus();} break;
    case "rmP": if(S.players.length>3){S.players.splice(+b.dataset.i,1);normalize();save();render();} break;
    case "mode": S.mode=b.dataset.v; save(); render(); break;
    case "cat": { const arr=S.mode==="words"?S.wordCats:S.qCats, c=b.dataset.c, i=arr.indexOf(c); i>=0?arr.splice(i,1):arr.push(c); save(); render(); break; }
    case "allCats": if(S.mode==="words") S.wordCats=Object.keys(WORDS).concat(S.wordCats.includes(CUSTOM)?[CUSTOM]:[]); else S.qCats=Object.keys(QUESTIONS); save(); render(); break;
    case "noCats": if(S.mode==="words") S.wordCats=[]; else S.qCats=[]; save(); render(); break;
    case "impMode": S.impMode=b.dataset.v; save(); render(); break;
    case "step": {
      const k=b.dataset.k, d=+b.dataset.d, maxI=S.players.length-1;
      if(k==="impFixed") S.impFixed=clamp(S.impFixed+d,1,maxI);
      if(k==="impMin"){S.impMin=clamp(S.impMin+d,0,maxI); if(S.impMax<S.impMin) S.impMax=S.impMin;}
      if(k==="impMax"){S.impMax=clamp(S.impMax+d,0,maxI); if(S.impMin>S.impMax) S.impMin=S.impMax;}
      save(); render(); break;
    }
    case "toggle": S[b.dataset.k]=!S[b.dataset.k]; save(); render(); break;
    case "timer": S.timer=+b.dataset.v; save(); render(); break;
    case "resetUsed": LS.set(S.mode==="words"?"imp.usedW":"imp.usedQ",[]); render(); toast("History cleared"); break;
    case "start": startRound(); break;
    case "show": screen = R.mode==="words"?"role":"answer"; render(); break;
    case "nextRole": R.i++; if(R.i<R.n) screen="pass"; else {screen="discuss"; T.left=S.timer*60; stopTimer();} render(); break;
    case "lock": { const v=$("#ans").value.trim(); if(!v) return; R.answers[R.i]=v; R.i++; screen = R.i<R.n?"pass":"qdone"; render(); break; }
    case "qreveal": screen="qreveal"; T.left=S.timer*60; stopTimer(); render(); break;
    case "timerToggle": timerToggle(); break;
    case "timerReset": timerInit(); break;
    case "arm":
      if(b.dataset.armed){ armed(b.dataset.then); }
      else { b.dataset.armed="1"; const orig=b.innerHTML; b.innerHTML="Tap again to confirm";
        setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.innerHTML=orig; } },2500); }
      break;
    case "again": stopTimer(); startRound(); break;
    case "setup": stopTimer(); screen="setup"; render(); break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.p!==undefined){ S.players[+t.dataset.p]=t.value; save(); }
  else if(t.id==="custom"){ S.custom=t.value; save(); const c=$("#ccount"); if(c) c.textContent=customList().length; }
  else if(t.dataset.w!==undefined){ S.weights[t.dataset.w]=+t.value; save(); updatePcts(); }
  else if(t.id==="ans"){ $("#lock").disabled=!t.value.trim(); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.id==="ans"){ e.preventDefault(); const l=$("#lock"); if(l&&!l.disabled) l.click(); }
});

render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
